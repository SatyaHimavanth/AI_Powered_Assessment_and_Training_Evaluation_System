[project]
name = "testsuite"
version = "0.1.0"
description = "Black-box API, concurrency, and Playwright workflows for the assessment application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.1.1",
    "pytest-playwright>=0.8.0",
    "requests>=2.34.2",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "api: safe black-box API tests",
    "stateful: tests that create or finalize application state",
    "e2e: Playwright browser workflow tests",
]
