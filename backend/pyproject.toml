[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=4.0.0",
    "fastapi>=0.136.1",
    "langchain>=1.3.0",
    "langchain-openai>=1.2.1",
    "langgraph>=1.2.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "passlib[bcrypt]>=1.7.4",
    "pgvector>=0.4.2",
    "psycopg2>=2.9.12",
    "pydantic>=2.13.3",
    "pyjwt>=2.12.1",
    "pypdf2>=3.0.0",
    "pytest>=9.1.1",
    "python-docx>=1.0.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
]

[project.optional-dependencies]
e2e = [
    "pytest-playwright>=0.7.2",
]

[tool.pytest.ini_options]
markers = [
    "e2e: browser-based end-to-end tests that require a running frontend and backend",
]
